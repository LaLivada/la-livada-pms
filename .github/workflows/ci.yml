name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (JSDoc pe src/lib si src/data)
        run: npm run typecheck

      - name: Test
        run: npm test

      # Aceeași suită și dintr-un alt fus: „ziua" trebuie să fie cea de la
      # Vaslui indiferent de mașină (faza 2, B6 din docs/audit-2026-09.md).
      # Pe ubuntu TZ e UTC — prea aproape de România ca să prindă greșelile.
      - name: Test (TZ=America/New_York)
        run: npm test
        env:
          TZ: America/New_York

      - name: Build
        run: npm run build

      # Site-ul de rezervări și aplicația de oaspete se construiesc din
      # același repo, dar cu alte configurații Vite. Fără pașii ăștia un
      # import rupt în src/booking sau src/guest trecea verde aici și pica
      # abia în Vercel.
      - name: Build rezervari.lalivada.ro
        run: npm run build:booking

      - name: Build guest.lalivada.ro
        run: npm run build:guest
