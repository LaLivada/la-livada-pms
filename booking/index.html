<!doctype html>

      .antet h1{ font-size:1.5em; margin:10px 0 2px; letter-spacing:-.01em; }
      .antet p{ margin:0; color:#5f6a66; font-size:.94em; }

    <div class="antet">
      <a href="https://lalivada.ro/">← Înapoi la lalivada.ro</a>
