    <!-- Spre deosebire de PMS (pms.lalivada.ro, cu noindex), pagina asta
         chiar trebuie indexată — canonical spre ea însăși, nu spre
         lalivada.ro. robots.txt e separat de-al PMS-ului (vezi
         vite.booking.config.js și public-booking/robots.txt), altfel
         Disallow-ul de-acolo ar fi blocat-o și pe asta. -->
    <link rel="canonical" href="https://rezervari.lalivada.ro/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:site_name" content="Complex La Livada" />
    <meta property="og:title" content="Cazare Vaslui - La Livada | Tiny houses și loft-uri" />
    <meta property="og:description" content="Cazare la Complex La Livada, Vaslui — 2 loft-uri și 14 Tiny houses, la câțiva metri de sălile de evenimente. Rezervă direct, fără comision de intermediar." />
    <meta property="og:url" content="https://rezervari.lalivada.ro/" />
    <meta property="og:image" content="https://rezervari.lalivada.ro/film/poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Aceleași trei fonturi ca pe lalivada.ro: Instrument Serif pentru
         titlurile obișnuite, Inter Tight 300 pentru titlul peste fotografie
         (rolul „fotografic" — vezi capul de pagină), Manrope pentru rest.
         Acolo vin din next/font (auto-hostate); aici, din Google Fonts
         direct — cele două build-uri nu împart un bundler, deci nu pot
         împărți nici fișierele de font. -->
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300&family=Manrope:wght@400;500&display=swap" />
    <link rel="stylesheet" href="./brand.css" />

  <body>
    <!-- @antet film=true -->

    <main>
      <section class="ldv-phead">
        <!-- Montajul propriu (poze-acces/Hotel.mp4, 13 septembrie 2026),
             nu mai e filmul de pe lalivada.ro. Tăiat la 26,6 s, înainte de
             fade-ul la negru de la final — într-o buclă ar fi clipit negru
             la fiecare reluare. Pe desktop, banda 16:9 e aleasă PE CADRU
             (semnul 1004, canapeaua, patul rămân în imagine); pe telefon,
             cadrul întreg cu margini estompate, ca înainte. Compresie 2-pass,
             H.264 High 4.0 — măsurată cu VMAF peste rețeta veche la medie,
             la cele mai slabe 5% din cadre și la minim, cu ~14% mai puțini
             octeți. Sursele stau în marcaj, nu se pun din script: pe iOS,
             un element gol în clipa în care Safari hotărăște dacă are voie
             să pornească singur pierde dreptul definitiv — vezi
             booking/film.js. -->
        <video id="ldv-film" class="ldv-phead-img"
          autoplay muted loop playsinline preload="metadata"
          poster="/film/poster.jpg"
          data-video-landscape="/film/hero-desktop.mp4"
          data-poster-landscape="/film/poster.jpg"
          data-video-portrait="/film/hero-mobile.mp4"
          data-poster-portrait="/film/poster-mobile.jpg">
          <source src="/film/hero-mobile.mp4" type="video/mp4" media="(max-width: 700px), (orientation: portrait)" />
          <source src="/film/hero-desktop.mp4" type="video/mp4" />
        </video>
        <script>
          (function () {
            var v = document.getElementById("ldv-film");
            if (!v) return;
            var p = window.matchMedia("(max-width: 700px), (orientation: portrait)").matches;
            v.setAttribute("poster", p ? v.dataset.posterPortrait : v.dataset.posterLandscape);
            // Cerut explicit de Ovidiu: filmul pornește indiferent de Reduce
            // Motion — spre deosebire de lalivada.ro, care respectă setarea.
            // Rămâne doar reducerea pe economie de date (Low Data Mode).
            var c = navigator.connection || {};
            if (c.saveData === true) {
              v.setAttribute("data-still", "true");
              v.removeAttribute("autoplay");
              v.preload = "none";
              while (v.firstChild) v.removeChild(v.firstChild);
            }
          })();
        </script>
        <div class="ldv-cue" aria-hidden="true"></div>
        <div class="wrap ldv-phead-in">
          <h1 class="ldv-h1">Cazare Tiny houses</h1>
          <p class="ldv-lede">Complex LA LIVADA - Vaslui</p>
        </div>
      </section>
      <div class="wrap ldv-form-wrap">
        <div id="rezervari"></div>
      </div>
