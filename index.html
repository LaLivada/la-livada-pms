<!doctype html>
<!-- lang="ro", nu "en" cum era din sablonul de pornire, si traducerea
     oprita explicit.
     Nu e cosmetica: aplicatia e scrisa integral in romana, dar se declara
     engleza, asa ca Chrome pe Android o traducea singur "in romana". Google
     Translate rescrie nodurile de text (le imbraca in <font>), React nu-si
     mai gaseste nodurile pe care le stia, iar prima actualizare cadea cu
     „insertBefore ... nu este un copil al acestui nod" — ecranul rosu de
     eroare pe care l-a vazut receptia. Semnul ca traducerea era de vina:
     pana si textul exceptiei si butonul erau reformulate ("Reincarcare
     interfata" in loc de "Reincarca interfata").
     `translate="no"` si meta-ul Google raman ca plasa, pentru cazul in care
     cineva cere traducerea manual din meniul browserului. -->
<html lang="ro" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <!-- Emblema complexului, aceleasi fisiere ca pe lalivada.ro si pe
         rezervari.lalivada.ro — copiate din lalivada-site/public/assets/,
         nu partajate: nu exista build comun intre repo-uri, deci daca
         emblema se schimba acolo, se copiaza si aici manual.
         Inainte era /background.png, o fotografie de fundal folosita pe
         post de pictograma: la 16 pixeli nu se distingea nimic din ea. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Aplicatie pe ecranul de start (25 septembrie 2026): fara aceste
         meta-uri si fara manifest, pictograma pusa din Safari deschidea tot
         Safari, cu bara lui peste meniul de jos al aplicatiei. Cu ele, iOS si
         Android o deschid singura (display: standalone), iar viewport-fit=cover
         face ca env(safe-area-inset-bottom) sa fie inaltimea barei de acasa a
         iPhone-ului — bara de navigare din src/styles/pms.css (.nav-jos) sta
         deasupra ei. Sesiunea din aplicatia de pe ecranul de start e separata
         de cea din Safari: prima deschidere cere autentificarea inca o data. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="La Livada PMS" />
    <meta name="theme-color" content="#F7F7F5" />
    <!-- Unealtă internă de recepție, nu conținut public — nu trebuie să
         apară în căutări. public/robots.txt (Disallow: /) completează asta
         pentru crawlere care ignoră meta tag-ul. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <!-- Fonturile stateau intr-un @import in capul stilurilor. Un @import
         trebuie sa fie prima regula a fisierului CSS, ceea ce nu se poate
         garanta cand bundler-ul concateneaza mai multe fisiere — ar fi
         devenit invalid, iar fonturile ar fi cazut tacut pe system-ui.
         Aici pornesc descarcarea imediat, in paralel cu CSS-ul, in loc sa
         astepte parsarea lui (un @import de font e o cascada: descarca
         CSS-ul, abia apoi afla ca mai are de descarcat fonturi). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <!-- Apare si in antetul paginilor tiparite de Safari/AirPrint (fisa de
         anuntare, factura), nu doar in fila browserului. -->
    <title>La Livada PMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
